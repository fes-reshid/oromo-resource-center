<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Decodes a deep link redirected here by the site's 404.html (see
      // /404.html at the repo root), restoring the real URL via
      // history.replaceState before React Router reads it.
      (function () {
        var params = new URLSearchParams(window.location.search);
        var redirect = params.get('redirect');
        if (redirect) {
          var dir = window.location.pathname.replace(/index\.html$/, '');
          window.history.replaceState(null, '', dir.replace(/\/$/, '') + redirect);
        }
      })();
    </script>
